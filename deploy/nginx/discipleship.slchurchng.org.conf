# DMS — nginx vhost for discipleship.slchurchng.org
# Serves the built React SPA and reverse-proxies the API + Socket.IO to the
# Node process on 127.0.0.1:4000 (same-origin, mirrors the local Docker setup).
#
# Install:  sudo cp deploy/nginx/discipleship.slchurchng.org.conf \
#             /etc/nginx/sites-available/ && \
#           sudo ln -sf /etc/nginx/sites-available/discipleship.slchurchng.org.conf \
#             /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
#         (deploy.sh does this via the dms-nginx-sync helper.)
#
# TLS:  this file OWNS the :443 block (self-contained — no certbot-managed
#       includes), so `dms-nginx-sync` on every deploy keeps HTTPS intact.
#       One-time cert issue (does NOT edit this file):
#         sudo certbot certonly --nginx -d discipleship.slchurchng.org \
#           -m <ops-email> --agree-tos --no-eff-email
#       Renewals are automatic (certbot systemd timer, nginx authenticator).

# ── HTTP :80 — ACME challenges + permanent redirect to HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name discipleship.slchurchng.org;

    # Let's Encrypt HTTP-01 challenge (used by `certbot certonly --nginx` and
    # by `certbot renew`; harmless otherwise).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS :443 — the app ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name discipleship.slchurchng.org;

    ssl_certificate     /etc/letsencrypt/live/discipleship.slchurchng.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/discipleship.slchurchng.org/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    root /var/www/dms/app/dms-frontend/dist;
    index index.html;

    # ── Security headers ──
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Upload ceiling (Cloudinary uploads pass through the API)
    client_max_body_size 25m;

    # ── Hashed Vite assets — cache hard ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── REST API ──
    location /v1/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Socket.IO (websocket upgrade) ──
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Health probe ──
    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
        access_log off;
    }

    # ── SPA fallback ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
