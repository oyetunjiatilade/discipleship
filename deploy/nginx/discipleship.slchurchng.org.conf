# DMS — nginx vhost for discipleship.slchurchng.org
# Serves the built React SPA and reverse-proxies the API + Socket.IO to the
# Node process on 127.0.0.1:4000 (same-origin, mirrors the local Docker setup).
#
# Install:  sudo cp deploy/nginx/discipleship.slchurchng.org.conf \
#             /etc/nginx/sites-available/ && \
#           sudo ln -sf /etc/nginx/sites-available/discipleship.slchurchng.org.conf \
#             /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
#
# TLS:  after DNS points here, run
#       sudo certbot --nginx -d discipleship.slchurchng.org
#       certbot rewrites this file to add the :443 server block + redirect.

server {
    listen 80;
    listen [::]:80;
    server_name discipleship.slchurchng.org;

    root /var/www/dms/app/dms-frontend/dist;
    index index.html;

    # ── Security headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Upload ceiling (Cloudinary uploads pass through the API)
    client_max_body_size 25m;

    # ── Hashed Vite assets — cache hard ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── REST API ──
    location /v1/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Socket.IO (websocket upgrade) ──
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Health probe ──
    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
        access_log off;
    }

    # ── SPA fallback ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
